name: Smart Review V1 Tests

on:
  push:
    branches:
      - feature/smart-review-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: |
          node --check smart-review-engine.mjs
          node --check smart-review-ui.mjs
          node --check smart-review-browser.test.mjs
      - name: Install test dependencies
        run: npm install
      - name: Run Smart Review engine tests
        run: npm test
      - name: Install browser for acceptance tests
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser acceptance tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
      - name: Upload Chromium PDF acceptance artifact
        if: matrix.browser == 'chromium' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-review-acceptance-pdf
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
