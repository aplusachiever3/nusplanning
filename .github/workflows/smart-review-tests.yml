name: Smart Review V1 Tests

on:
  push:
    branches:
      - feature/smart-review-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: |
          node --check smart-review-engine.mjs
          node --check smart-review-ui.mjs
          node --check smart-review-browser.test.mjs
      - name: Install test dependencies
        run: npm install
      - name: Run Smart Review engine tests
        run: npm test
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run real-browser acceptance tests
        run: npm run test:browser
